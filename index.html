    <div id="background">

    </div>

    <div id="safe">
        <div id="panel" class="border trans-med">
            <div id="panel-add-button" class="button">
                <span class="material-symbols-rounded">add</span>
                <h3>Add...</h3>
            </div>
            <hr>
            <div id="panel-preferences" class="button button-close">
                <span class="material-symbols-rounded">settings</span>
                <h2>Preferences</h2>
            </div>

            <div id="panel-add" class="panel-extend border trans-med">
                <div class="button button-close">
                    <span class="material-symbols-rounded">category</span>
                    <h2>Category</h2>
                </div>
                <div class="button button-close">
                    <span class="material-symbols-rounded">add_box</span>
                    <h2>Item</h2>
                </div>
                <div class="button button-close">
                    <span class="material-symbols-rounded">text_fields</span>
                    <h2>Text</h2>
                </div>
            </div>
        </div>
        <div id="preferences" class="border trans-med">
            <div class="title-wrapper">
                <h1>Preferences</h1>
                <div id="preferences-close" class="button">
                    <span class="material-symbols-rounded">close</span>
                </div>
            </div>
            <hr>
            <div class="main">
                <div class="item">
                    <h3>Border radius</h3>
                    <h2>How much should the angles be smoothed out</h2>
                    <div class="rangeslider">
                        <div class="value">
                            <h3 id="preference-br-value">10<span>px</span></h3>
                        </div>
                        <input type="range" id="preference-br" class="range" min="0" max="25" value="10">
                    </div>
                </div>
            </div>
        </div>

        <div id="categories">
            <div class="indicator"></div>
        </div>
    </div>
</body>
